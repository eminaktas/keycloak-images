apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: keycloak

resources:
  - github.com/keycloak/keycloak-k8s-resources/kubernetes/cluster-wide?ref=26.7.2

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: keycloak-operator
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/eminaktas/keycloak-operator:latest

      - op: remove
        path: /spec/template/spec/containers/0/env/1
