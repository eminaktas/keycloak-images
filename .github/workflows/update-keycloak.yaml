name: Update Keycloak

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1-5"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Update active tracks
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./hack/update-versions.sh
      - run: make validate
      - name: Open or refresh update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/keycloak-updates
          delete-branch: true
          commit-message: Update active Keycloak releases
          title: Update active Keycloak releases
          body: |
            Updates each active Keycloak track to its newest stable patch release, pins the corresponding upstream commit, and selects the newest published Kubernetes resources for that track.

            Generated by the scheduled Keycloak update workflow.
