name: PR Test Build

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: presubmit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Validate and select active tracks
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      has_tracks: ${{ steps.matrix.outputs.has_tracks }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: make validate
      - id: matrix
        name: Select changed tracks
        shell: bash
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: |
          selected="$(./hack/select-tracks.sh presubmit "$BASE_REVISION")"
          echo "Selected tracks: $selected"
          echo "value=$(./hack/matrix.sh tracks "$selected")" >> "$GITHUB_OUTPUT"
          if [[ "$(jq length <<<"$selected")" -gt 0 ]]; then
            echo "has_tracks=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tracks=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Keycloak ${{ matrix.track }} pair
    needs: prepare
    if: needs.prepare.outputs.has_tracks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-pair
        with:
          track: ${{ matrix.track }}
          archs: x86_64
